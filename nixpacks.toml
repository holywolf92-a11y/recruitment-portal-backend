[variables]
NIXPACKS_NODE_VERSION = "20"

[phases.setup]
nixPkgs = ["nodejs", "chromium"]

[phases.install]
env = {
  PUPPETEER_SKIP_CHROMIUM_DOWNLOAD = "true"
  PUPPETEER_EXECUTABLE_PATH = "/usr/bin/chromium"
}
cmds = [
  "rm -rf /app/node_modules/.cache || true",
  "npm ci --production=false"
]

[phases.build]
cmds = [
  "npm run build"
]

[start]
cmd = "npm start"
